<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Home Lab Network Engineering</title>
  <desc id="desc">A dark, modern network engineering banner with connected firewall, switching, Wi-Fi, compute, and storage nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0d1f35"/>
      <stop offset="1" stop-color="#102c3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d6c5"/>
      <stop offset="1" stop-color="#55a9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ab3d9" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow{font:700 16px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#68e2d4}
      .title{font:700 47px Arial,Helvetica,sans-serif;letter-spacing:-1px;fill:#f2f7ff}
      .subtitle{font:400 20px Arial,Helvetica,sans-serif;fill:#b6c9dc}
      .pill{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#dcfdf7}
      .nodeTitle{font:700 14px Arial,Helvetica,sans-serif;fill:#f3f8ff}
      .nodeSub{font:400 11px Arial,Helvetica,sans-serif;fill:#a8bfd4}
      .foot{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:1.5px;fill:#8ca8c1}
    </style>
  </defs>
  <rect width="1440" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="20" fill="url(#grid)"/>
  <circle cx="1155" cy="220" r="235" fill="#21c9bd" opacity=".05"/>
  <circle cx="1155" cy="220" r="170" fill="none" stroke="#55a9ff" stroke-opacity=".14" stroke-width="1.5"/>
  <circle cx="1155" cy="220" r="120" fill="none" stroke="#55a9ff" stroke-opacity=".14" stroke-width="1.5"/>
  <path d="M70 68H118" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="104" class="eyebrow">THE BUILD LOG</text>
  <text x="70" y="166" class="title">HOME LAB /</text>
  <text x="70" y="219" class="title">NETWORK ENGINEERING</text>
  <text x="72" y="263" class="subtitle">Design it. Bring it online. Measure it.</text>
  <text x="72" y="291" class="subtitle">Document what works — and what still needs proof.</text>
  <rect x="70" y="330" width="340" height="38" rx="19" fill="#143f4c" stroke="#2b8f91" stroke-opacity=".85"/>
  <circle cx="91" cy="349" r="4" fill="#59e1c6" filter="url(#glow)"/>
  <text x="105" y="353" class="pill">DOCUMENTED · MEASURED · ITERATIVE</text>
  <!-- connected network map -->
  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <path d="M1138 118L1014 188L1138 248L1260 188L1138 118" stroke="#4bb5ff" stroke-opacity=".72"/>
    <path d="M1014 188L1005 300L1138 348L1260 300L1260 188" stroke="#41d7c5" stroke-opacity=".6"/>
    <path d="M1138 248L1138 348" stroke="#41d7c5" stroke-opacity=".72"/>
    <path d="M1005 300L925 252" stroke="#a98aff" stroke-opacity=".8" stroke-dasharray="5 7"/>
    <path d="M1260 300L1320 255" stroke="#a98aff" stroke-opacity=".8" stroke-dasharray="5 7"/>
  </g>
  <g>
    <rect x="1053" y="82" width="170" height="66" rx="13" fill="#102a41" stroke="#4bb5ff" stroke-width="1.6"/>
    <circle cx="1074" cy="103" r="5" fill="#4bb5ff"/>
    <text x="1087" y="108" class="nodeTitle">OPNsense</text>
    <text x="1070" y="129" class="nodeSub">Firewall · Routing</text>
    <rect x="929" y="157" width="170" height="66" rx="13" fill="#102a41" stroke="#41d7c5" stroke-width="1.6"/>
    <circle cx="950" cy="178" r="5" fill="#41d7c5"/>
    <text x="963" y="183" class="nodeTitle">Core Switching</text>
    <text x="946" y="204" class="nodeSub">RUCKUS · Ethernet</text>
    <rect x="1053" y="215" width="170" height="66" rx="13" fill="#102a41" stroke="#41d7c5" stroke-width="1.6"/>
    <circle cx="1074" cy="236" r="5" fill="#41d7c5"/>
    <text x="1087" y="241" class="nodeTitle">Wi-Fi</text>
    <text x="1070" y="262" class="nodeSub">Omada EAP650</text>
    <rect x="1175" y="157" width="170" height="66" rx="13" fill="#102a41" stroke="#4bb5ff" stroke-width="1.6"/>
    <circle cx="1196" cy="178" r="5" fill="#4bb5ff"/>
    <text x="1209" y="183" class="nodeTitle">Compute</text>
    <text x="1192" y="204" class="nodeSub">CSI · Framework</text>
    <rect x="1053" y="315" width="170" height="66" rx="13" fill="#102a41" stroke="#a98aff" stroke-width="1.6"/>
    <circle cx="1074" cy="336" r="5" fill="#a98aff"/>
    <text x="1087" y="341" class="nodeTitle">Storage</text>
    <text x="1070" y="362" class="nodeSub">TrueNAS · Backups</text>
    <rect x="846" y="218" width="150" height="66" rx="13" fill="#171f3b" stroke="#a98aff" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="921" y="244" text-anchor="middle" class="nodeTitle">Future WAN</text>
    <text x="921" y="264" text-anchor="middle" class="nodeSub">5G · Planned</text>
    <rect x="1279" y="221" width="120" height="66" rx="13" fill="#171f3b" stroke="#a98aff" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="1339" y="247" text-anchor="middle" class="nodeTitle">10 GbE</text>
    <text x="1339" y="267" text-anchor="middle" class="nodeSub">Future uplink</text>
  </g>
  <path d="M70 402H1370" stroke="#8ab3d9" stroke-opacity=".18"/>
  <text x="70" y="422" class="foot">ROUTING</text>
  <circle cx="166" cy="417" r="3" fill="#41d7c5"/>
  <text x="181" y="422" class="foot">SWITCHING</text>
  <circle cx="296" cy="417" r="3" fill="#41d7c5"/>
  <text x="311" y="422" class="foot">WIRELESS</text>
  <circle cx="412" cy="417" r="3" fill="#4bb5ff"/>
  <text x="427" y="422" class="foot">COMPUTE</text>
  <circle cx="525" cy="417" r="3" fill="#a98aff"/>
  <text x="540" y="422" class="foot">STORAGE</text>
  <text x="1370" y="422" text-anchor="end" class="foot">FIELD NOTES + TEST RESULTS</text>
</svg>